YAML
name: Generate Bible TTS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - run: python bible_tts.py

      - uses: actions/upload-artifact@v4
        with:
          name: bible-audio
          path: bible_output.mp3
